<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Friday interaction preview</title>
    <style>
      body {
        background: radial-gradient(ellipse at 35% 20%, #303b46, #141b25) !important;
      }
      #root {
        position: fixed;
        height: auto !important;
      }
      #preview-controls {
        position: fixed;
        bottom: 24px;
        left: 24px;
        color: #c8d0d5;
        font: 13px system-ui;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      #preview-controls select,
      #preview-controls button {
        padding: 8px;
        border-radius: 8px;
        background: #26323e;
        color: #e8ecef;
        border: 1px solid #52606e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="preview-controls">
      <span>Preview · simulated microphone</span
      ><select id="scenario">
        <option>multiple</option>
        <option>one</option>
        <option>off</option>
        <option>quiet</option>
        <option>listening</option>
        <option>thinking</option>
        <option>camera</option>
        <option>speaking</option>
        <option>guidance</option>
        <option>control</option>
        <option>approval</option>
        <option>updates</option>
        <option>error</option></select
      ><button id="reset">Reset</button>
    </div>
    <script>
      const scenario = new URLSearchParams(location.search).get('state') || 'multiple';
      document.querySelector('#scenario').value = scenario;
      document.querySelector('#scenario').onchange = (e) => (location.search = '?state=' + e.target.value);
      document.querySelector('#reset').onclick = () => location.reload();
      const noop = async () => {};
      const callbacks = {};
      const now = Date.now();
      const child = (id, title, status = 'running') => ({
        id,
        role: 'child',
        parentId: 'parent',
        title,
        status,
        createdAt: now,
        updatedAt: now,
        summary: status === 'completed' ? 'Found three useful options' : undefined,
        question: status === 'needs_input' ? 'Which folder should I use?' : undefined,
      });
      const all = [
        child('a', 'Compare train options'),
        child('b', 'Summarize the release notes'),
        child('c', 'Organize the project notes'),
      ];
      const runtime = {
        camera: scenario === 'camera' ? 'live' : 'off',
        parentId: 'parent',
        sessions:
          scenario === 'one'
            ? all.slice(0, 1)
            : ['multiple', 'listening', 'startup-error-background'].includes(scenario)
              ? all
              : scenario === 'updates'
                ? [
                    child('a', 'Compare train options', 'completed'),
                    child('b', 'Summarize the release notes', 'failed'),
                    child('c', 'Organize the project notes', 'needs_input'),
                  ]
                : [],
        presentation: {
          text: ['guidance', 'approval'].includes(scenario)
            ? 'Open Settings, then choose Sound. I’ll wait here while you take a look.'
            : '',
          expanded: ['guidance', 'approval'].includes(scenario),
          speaking: scenario === 'speaking',
        },
      };
      const restoredError = ['startup-error', 'startup-error-background'].includes(scenario);
      const tasks =
        ['thinking', 'approval', 'error'].includes(scenario) || restoredError
          ? [
              {
                id: 'p',
                role: 'parent',
                conversationId: 'parent',
                prompt: 'Help with settings',
                status:
                  scenario === 'approval'
                    ? 'awaiting_approval'
                    : scenario === 'error' || restoredError
                      ? 'failed'
                      : 'thinking',
                error: restoredError
                  ? 'The desktop connection timed out. Please try again.'
                  : scenario === 'error'
                    ? 'I couldn’t open that file. Please choose it again.'
                    : undefined,
                steps: [],
                createdAt: now,
                updatedAt: now,
                approval:
                  scenario === 'approval'
                    ? {
                        id: 'approval',
                        title: 'Open this link?',
                        message: 'This will open the browser.',
                        createdAt: now,
                      }
                    : undefined,
              },
            ]
          : scenario === 'camera'
            ? [
                ['Can you see my cube?', 'The green face looks solved. Turn it so I can see the top.', 2],
                ['Check now', 'Good. Now turn the right face up once.', 1],
              ].map(([prompt, text, cameraFrames], i) => ({
                id: `camera-${i}`,
                role: 'parent',
                conversationId: 'parent',
                prompt,
                status: 'completed',
                cameraFrames,
                interactions: [
                  {
                    id: `ix-${i}`,
                    createdAt: now + i,
                    updatedAt: now + i,
                    timing: 'parallel',
                    status: 'completed',
                    // The second reply was speech-only with spoken replies off; it must still stay visible.
                    actions: [
                      i
                        ? { tool: 'speak_tool', status: 'suppressed', text }
                        : { tool: 'show_text_tool', status: 'completed', text },
                    ],
                  },
                ],
                steps: [],
                createdAt: now + i,
                updatedAt: now + i,
              }))
            : [];
      const fixture = (window.fixture = {
        runtime,
        tasks,
        guiding: scenario === 'guidance',
        controlling: scenario === 'control',
        calls: [],
        surfaceChanges: [],
        level: 0,
        clock: 0,
        pending: [],
        transcripts: new Map(),
        emit() {
          callbacks.onFridayState?.(structuredClone(runtime));
          callbacks.onGuidance?.(fixture.guiding);
          callbacks.onControlling?.(fixture.controlling);
        },
        task(t) {
          callbacks.onTask?.(t);
        },
        /** A synthetic JPEG standing in for a live camera frame. */
        async cameraFrame() {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 240;
          const context = canvas.getContext('2d');
          context.fillStyle = '#3a7d44';
          context.fillRect(0, 0, 320, 240);
          context.fillStyle = '#f4d35e';
          context.fillRect(110, 70, 100, 100);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg'));
          callbacks.onCameraFrame?.(new Uint8Array(await blob.arrayBuffer()));
        },
        listen() {
          callbacks.onListen?.();
        },
        stopMic() {
          callbacks.onStopListening?.();
        },
        finish(result) {
          const job = fixture.pending.shift();
          if (job) {
            fixture.transcripts.set(job.request.segment, result);
            job.resolve({ ...job.request, ...result, inferenceMs: 100 });
          }
        },
      });
      const time = performance.now.bind(performance);
      // Motion's native animations share the browser timeline; keep it real for motion probes.
      if (!new URLSearchParams(location.search).has('motion')) performance.now = () => time() + fixture.clock;
      // Deterministic PCM graph fixture. Real AudioWorklet/resampling is exercised separately.
      window.AudioWorkletNode = class {
        constructor() {
          fixture.capture = this;
          this.port = {
            postMessage: (data) => {
              if (data.type === 'start') {
                this.token = data.token;
                this.state = 'recording';
              }
              if (data.type === 'pause') this.state = 'inactive';
              if (data.type === 'flush') {
                this.state = 'inactive';
                this.port.onmessage?.({ data: { type: 'flushed', token: this.token } });
              }
            },
            close: () => clearInterval(this.timer),
          };
          this.timer = setInterval(() => this.frame(), 20);
        }
        frame() {
          if (this.state !== 'recording') return;
          this.port.onmessage?.({
            data: {
              type: 'frame',
              token: this.token,
              audio: new Int16Array(320).fill(fixture.level ? 4300 : 0).buffer,
            },
          });
        }
        endUtterance() {
          fixture.level = 0;
          for (let i = 0; i < 43; i++) this.frame();
        }
        connect() {}
        disconnect() {
          clearInterval(this.timer);
        }
      };
      window.AudioContext = class {
        audioWorklet = { addModule: async () => {} };
        destination = {};
        resume = async () => {};
        close = async () => {};
        createMediaStreamSource() {
          return { connect() {}, disconnect() {} };
        }
      };
      Object.defineProperty(navigator, 'mediaDevices', {
        value: {
          async getUserMedia() {
            fixture.calls.push(['microphone']);
            const stream = {
              active: true,
              getTracks() {
                return [
                  {
                    stop() {
                      stream.active = false;
                    },
                  },
                ];
              },
              getAudioTracks() {
                return [
                  {
                    addEventListener(event, callback) {
                      if (event === 'ended')
                        fixture.disconnect = () => {
                          stream.active = false;
                          callback();
                        };
                    },
                  },
                ];
              },
            };
            return stream;
          },
        },
      });
      window.buddy = {
        voiceGate: async () => ({ localWake: false, partials: true }),
        fridayState: async () => runtime,
        guidance: async () => fixture.guiding,
        controlling: async () => fixture.controlling,
        listTasks: async () => tasks,
        getSettings: async () => ({ wakeWord: 'Friday', cameraEnabled: true }),
        updateSettings: async (next) => {
          fixture.calls.push(['settings', next]);
          return { wakeWord: 'Friday', ...next };
        },
        desktopStatus: async () => ({ ready: true }),
        silence: noop,
        interrupt: async () => {
          fixture.calls.push(['interrupt']);
        },
        livekit: {
          session: async () => undefined,
          listener: noop,
          observed: noop,
          onExpect: () => noop,
          onCancelled: () => noop,
          onMicrophone: () => noop,
          onMicrophoneReady: () => noop,
        },
        listening(s) {
          fixture.listening = s;
        },
        setSurface: async (layout, height, contentWidth) => {
          fixture.surfaceChanges.push({ layout, height, contentWidth });
          fixture.surface = layout;
          const root = document.querySelector('#root');
          const w = { orb: 96, tasks: 400, quiet: 520, bar: 520, panel: 520, details: 760 }[layout];
          root.style.width = `min(${w}px, calc(100vw - 24px))`;
          const bottom =
            new URLSearchParams(location.search).get('anchor') === 'bottom' &&
            ['quiet', 'bar', 'panel'].includes(layout);
          root.style.top = bottom ? 'auto' : ['orb', 'tasks', 'details'].includes(layout) ? '12px' : '5px';
          root.style.bottom = bottom ? '5px' : 'auto';
          root.style.left = ['orb', 'tasks'].includes(layout) ? 'auto' : '50%';
          root.style.right = ['orb', 'tasks'].includes(layout) ? '18px' : 'auto';
          root.style.transform = ['orb', 'tasks'].includes(layout) ? 'none' : 'translateX(-50%)';
          fixture.height = height;
          fixture.contentWidth = contentWidth;
        },
        submit: async (text, context) => {
          fixture.calls.push(['submit', text, context]);
          const t = {
            id: 'request',
            role: 'parent',
            conversationId: 'parent',
            prompt: text,
            status: 'thinking',
            steps: [],
            createdAt: now,
            updatedAt: now,
          };
          fixture.request = t;
          fixture.task(t);
          return t;
        },
        transcribePcm: (request) => {
          const result = fixture.transcripts.get(request.segment);
          if (result) return Promise.resolve({ ...request, ...result, inferenceMs: 100 });
          return new Promise((resolve) => fixture.pending.push({ request, resolve }));
        },
        stop: async () => {
          fixture.calls.push(['stop']);
          if (runtime.camera !== 'off') runtime.camera = fixture.deferCameraClose ? 'closing' : 'off';
          fixture.guiding = false;
          runtime.presentation = { text: '', expanded: false, speaking: false };
          for (const t of tasks)
            if (['thinking', 'acting', 'awaiting_approval'].includes(t.status)) {
              t.status = 'cancelled';
              fixture.task(t);
            }
          if (fixture.request) fixture.task({ ...fixture.request, status: 'cancelled' });
          for (const session of runtime.sessions) session.status = 'cancelled';
          fixture.emit();
        },
        stopForeground: async () => {
          fixture.calls.push(['stopForeground']);
        },
        stopChild: async (id) => {
          fixture.calls.push(['stopChild', id]);
          runtime.sessions.find((s) => s.id === id).status = 'cancelled';
          fixture.emit();
        },
        approve: async (id, approved) => {
          fixture.calls.push(['approve', id, approved]);
        },
        setExpanded: async (v) => {
          if (v) await window.buddy.setSurface('details');
          document
            .querySelector('#root')
            .style.setProperty('height', v ? 'min(800px, calc(100vh - 24px))' : 'auto', 'important');
          callbacks.onExpanded?.(v);
        },
        hide: noop,
        /** ?anchor=bottom previews a notch dragged too low for its panel to open downward. */
        notchAnchor: async () => new URLSearchParams(location.search).get('anchor') ?? 'top',
        notchAnchorReady: () => fixture.calls.push(['anchorReady']),
        /** Plays main's edge switch: hide, wait for the renderer, re-place, show. */
        switchAnchor(next) {
          callbacks.onNotchAnchorPrepare?.();
          fixture.pendingAnchor = next;
        },
        finishAnchor() {
          callbacks.onNotchAnchor?.(fixture.pendingAnchor);
        },
        setNotchOffset: async (offset) => {
          fixture.calls.push(['notchOffset', offset]);
        },
        setCamera: async (on) => {
          fixture.calls.push(['camera', on]);
          runtime.camera = on ? 'live' : 'off';
          fixture.emit();
        },
      };
      for (const name of [
        'onTask',
        'onFridayState',
        'onListen',
        'onStopListening',
        'onExpanded',
        'onMark',
        'onGuidance',
        'onControlling',
        'onCameraFrame',
        'onNotchAnchor',
        'onNotchAnchorPrepare',
      ])
        window.buddy[name] = (fn) => {
          callbacks[name] = fn;
          return () => {
            delete callbacks[name];
          };
        };
      function initializeScenario() {
        if (!fixture.listening || fixture.listening === 'starting') return setTimeout(initializeScenario, 50);
        fixture.emit();
        if (scenario === 'error') fixture.task(tasks[0]);
        if (scenario === 'off') fixture.stopMic();
        else if (!['listening', 'startup', 'thinking', 'speaking', 'approval', 'error'].includes(scenario))
          fixture.clock += 11000;
      }
      setTimeout(initializeScenario, 500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
